name: release
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Stage release artifacts
        run: |
          mkdir -p release
          (cd dist && zip -r ../release/agentbeacon-chromium.zip .)
          (cd release && sha256sum agentbeacon-chromium.zip > checksums.txt)
          cat release/checksums.txt
      - name: Attach artifacts to the release
        # actions/upload-artifact only stores these in the run's artifact store
        # (login-only, 90-day expiry), which is not the download a user looks for
        # on the Release page. --clobber keeps this idempotent against
        # publish_repo.sh, which uploads dist/* itself.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
                 --title "${GITHUB_REPOSITORY##*/} $GITHUB_REF_NAME" --notes "Release $GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber \
            release/agentbeacon-chromium.zip release/checksums.txt
